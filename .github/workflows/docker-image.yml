name: Docker Image CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Đăng nhập vào Docker Hub sử dụng Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    # 2. Thiết lập môi trường Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Build và Push trực tiếp lên repo thang909/voting-app-microservice-result
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ../../
        file: ./Dockerfile
        push: true
        tags: |
          thang909/voting-app-microservice-result:latest
          thang909/voting-app-microservice-result:${{ github.sha }}