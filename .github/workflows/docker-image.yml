name: Docker Image CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 1. Checkout code từ repository
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Đăng nhập vào Docker Hub sử dụng secrets đã lưu trong repository settings
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}  

    # 3. Build và Push trực tiếp lên repo Docker Hub 
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          thang909/voting-app-microservice-result:latest
          thang909/voting-app-microservice-result:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Set up Kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
        echo "KUBECONFIG=./kubeconfig" >> $GITHUB_ENV

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment result-deploy result=thang909/voting-app-microservice-result:${{ github.sha }} --namespace=prod
        kubectl rollout status deploy result-deploy --namespace=prod