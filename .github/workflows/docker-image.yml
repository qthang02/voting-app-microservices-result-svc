name: Docker Image CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 1. Checkout code từ repository
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Đăng nhập vào Docker Hub sử dụng secrets đã lưu trong repository settings
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}  

    # 3. Build và Push trực tiếp lên repo Docker Hub 
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          thang909/voting-app-microservice-result:latest
          thang909/voting-app-microservice-result:${{ github.sha }}